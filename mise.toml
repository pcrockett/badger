[tools]
actionlint = "latest"
bats = "latest"
just = "latest"
pre-commit = "latest"
rust = {
  version = "latest",
  targets = ["x86_64-unknown-linux-musl"],
  components = ["clippy", "rustfmt"]
}
shellcheck = "latest"
shfmt = "latest"
uv = "latest"
yamlfmt = "latest"
yamllint = "latest"

[settings]
lockfile_platforms = ["linux-x64", "linux-x64-musl"]
